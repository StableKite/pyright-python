name: 'Supplemental original wrapper cases on real macOS26; macOS15 gate remains open'
on:
  push:
    branches: ['stablekite/native-typing-macos26-supplemental-v2']

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-26, windows-latest]
        node: [14, 16, 18]
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12"]
        exclude:
          - os: macos-26
            node: 14
          - os: macos-26
            python-version: "3.7"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d38c146a12d8f5344c65cf36b681f94bc0514c4
      - name: Verify immutable reviewed source
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "reviewed_source=$actual"
          test "$actual" = "8d38c146a12d8f5344c65cf36b681f94bc0514c4"

      # TODO: ensure that pyright-python uses this node version
      - uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Python ${{ matrix.python-version }}
        if: runner.os != 'macOS' || !contains(fromJSON('["3.8", "3.9", "3.10"]'), matrix.python-version)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build legacy Python natively on macOS ARM64
        if: runner.os == 'macOS' && contains(fromJSON('["3.8", "3.9", "3.10"]'), matrix.python-version)
        shell: bash
        env:
          PYENV_ROOT: ${{ runner.temp }}/stablekite-pyenv-legacy
        run: |
          test "$(uname -m)" = "arm64"
          git clone --no-checkout https://github.com/pyenv/pyenv.git "$PYENV_ROOT"
          git -C "$PYENV_ROOT" checkout --detach 03ffc48ef3cd33808899773df586f3cc7f74470a
          test "$(git -C "$PYENV_ROOT" rev-parse HEAD)" = "03ffc48ef3cd33808899773df586f3cc7f74470a"
          version=$("$PYENV_ROOT/bin/pyenv" latest -k "${{ matrix.python-version }}")
          echo "legacy_python_source_version=$version"
          shasum -a 256 "$PYENV_ROOT/plugins/python-build/share/python-build/$version"
          "$PYENV_ROOT/bin/pyenv" install "$version"
          echo "$PYENV_ROOT/versions/$version/bin" >> "$GITHUB_PATH"

      - name: Verify native macOS runtime architecture and Python version
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECTED_PYTHON_MINOR: ${{ matrix.python-version }}
        run: |
          test "$(uname -m)" = "arm64"
          test "$(node -p 'process.arch')" = "arm64"
          python -c 'import os,platform,sys; print(sys.version); print(sys.executable); print(platform.machine()); assert platform.machine() == "arm64"; assert "%d.%d" % sys.version_info[:2] == os.environ["EXPECTED_PYTHON_MINOR"]'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt

      - name: Download pyright dist
        run: |
          python scripts/download_pyright.py

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('dev-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Ensure node version
        run: |
          python .github/scripts/check_node.py '${{ matrix.node }}'

      - name: Run tests
        run: |
          tox -e setup,py,report

  lint:
    name: lint
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        python-version: [3.9]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d38c146a12d8f5344c65cf36b681f94bc0514c4
      - name: Verify immutable reviewed source
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "reviewed_source=$actual"
          test "$actual" = "8d38c146a12d8f5344c65cf36b681f94bc0514c4"

      - name: Build legacy lint Python natively on Ubuntu
        shell: bash
        env:
          PYENV_ROOT: ${{ runner.temp }}/stablekite-pyenv-lint
        run: |
          uname -a
          git clone --no-checkout https://github.com/pyenv/pyenv.git "$PYENV_ROOT"
          git -C "$PYENV_ROOT" checkout --detach 03ffc48ef3cd33808899773df586f3cc7f74470a
          test "$(git -C "$PYENV_ROOT" rev-parse HEAD)" = "03ffc48ef3cd33808899773df586f3cc7f74470a"
          version=$("$PYENV_ROOT/bin/pyenv" latest -k "${{ matrix.python-version }}")
          echo "legacy_lint_python_source_version=$version"
          shasum -a 256 "$PYENV_ROOT/plugins/python-build/share/python-build/$version"
          "$PYENV_ROOT/bin/pyenv" install "$version"
          "$PYENV_ROOT/versions/$version/bin/python" -c "import sys,platform; print(sys.version); print(platform.platform()); print(platform.machine())"
          echo "$PYENV_ROOT/versions/$version/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('dev-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Check linters
        run: |
          tox -e lint

  docker:
    name: docker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        docker-platform: [linux/amd64, linux/arm64]
        python-os-distro: [slim-bullseye, alpine]
        exclude:
          # Dockerfile is currently broken for alpine / arm64
          # https://github.com/RobertCraigie/pyright-python/issues/123
          - docker-platform: linux/arm64
            python-os-distro: alpine
          # This is currently way too slow, takes ~30 minutes to complete
          # TODO: investigate
          - docker-platform: linux/arm64
            python-os-distro: slim-bullseye
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d38c146a12d8f5344c65cf36b681f94bc0514c4
      - name: Verify immutable reviewed source
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "reviewed_source=$actual"
          test "$actual" = "8d38c146a12d8f5344c65cf36b681f94bc0514c4"

      # https://github.com/docker/build-push-action/
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download pyright dist
        run: |
          python scripts/download_pyright.py

      - name: Docker Build
        uses: docker/build-push-action@v3
        # https://github.com/docker/build-push-action/#inputs
        # Test each platform individually for easier testing
        with:
          context: .
          file: tests/Dockerfile
          platforms: "${{ matrix.docker-platform }}"
          build-args: OS_DISTRO=${{ matrix.python-os-distro }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-windows:
    name: docker (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d38c146a12d8f5344c65cf36b681f94bc0514c4
      - name: Verify immutable reviewed source
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "reviewed_source=$actual"
          test "$actual" = "8d38c146a12d8f5344c65cf36b681f94bc0514c4"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download pyright dist
        run: |
          python scripts/download_pyright.py

      - name: Docker Build
        # Use --% to allow double hyphen
        # Caching not currently working since we don't use buildx yet, windows
        # support seems poor because of interactions with --privileged
        # --cache-from=type=gha --cache-to=type=gha,mode=max
        run: |
          docker build --% -f tests/windows.Dockerfile -t pyright-python .

  docker-minimal:
    name: docker (minimal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d38c146a12d8f5344c65cf36b681f94bc0514c4
      - name: Verify immutable reviewed source
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "reviewed_source=$actual"
          test "$actual" = "8d38c146a12d8f5344c65cf36b681f94bc0514c4"

      - name: Docker Build
        run: |
          REF=8d38c146a12d8f5344c65cf36b681f94bc0514c4
          docker run python:3.11.4 /bin/sh -c "
            pip install git+https://github.com/StableKite/pyright-python.git@$REF && \
            pyright --version
          "

  tests_status:
    if: always()

    needs:
      - test
      - lint
      - docker
      - docker-windows

    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
